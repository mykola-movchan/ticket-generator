<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Conference ticket generator</title>
</head>
<body>
  <main>
    <section class="form">
      <img src="images/logo-full.svg" alt="">
      
      <h1 class="inconsolata-800">Your Journey to Coding Conf 2025 Starts Here!</h1>

      <h3 class="inconsolata-500">Secure your spot at next year's biggest coding conference.</h3>

      <form>
        <fieldset class="inconsolata-400">
          <label for="avatar">Upload Avatar</label>
          <input type="file" accept="image/png, image/jpeg, image/webp" data-message="Drag and drop or click to upload">
          <span class="note">Upload your photo (JPG or PNG, max size: 500KB).</span>
        </fieldset>
        
        <fieldset class="inconsolata-400">
          <label for="fullName">Full Name</label>
          <input type="text" name="fullName" id="fullName">
        </fieldset>

        <fieldset class="inconsolata-400">
          <label for="email">Email Address</label>
          <input type="text" name="email" id="email" placeholder="example@email.com">
        </fieldset>

        <fieldset class="inconsolata-400">
          <label for="github">GitHub Username</label>
          <input type="text" name="github" id="github" placeholder="@yourusername">
        </fieldset>

        <button class="inconsolata-700">Generate My Ticket</button>
      </form>
    </section>
    <!-- 
    <section class="ticket">
      Congrats, Full Name! Your ticket is ready.

  We've emailed your ticket to Email Address and will send updates in the run up to the event.

  Coding Conf
  Jan 31, 2025 / Austin, TX
    </section>
     -->
  </main>
</body>
</html>
